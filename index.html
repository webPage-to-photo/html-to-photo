<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML转图片工具 - 在线转换器</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>

<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container">
            <h1 class="logo">📸 HTML转图片工具</h1>
            <a href="https://github.com" target="_blank" class="github-link">
                <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
                </svg>
                GitHub
            </a>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <div class="container">
            <div class="layout-grid">
                <!-- 左侧：代码输入区 -->
                <div class="input-section">
                    <div class="section-header">
                        <h2>1. 粘贴HTML代码</h2>
                        <span class="hint">支持包含 &lt;section class="page"&gt; 的HTML</span>
                    </div>
                    <textarea id="html-input" class="code-input"
                        placeholder="将完整的HTML代码粘贴到这里...&#10;&#10;示例格式：&#10;&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;&#10;&lt;head&gt;...&lt;/head&gt;&#10;&lt;body&gt;&#10;  &lt;section class=&quot;page&quot;&gt;...&lt;/section&gt;&#10;  &lt;section class=&quot;page&quot;&gt;...&lt;/section&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;"></textarea>
                </div>

                <!-- 右侧：预览区 -->
                <div class="preview-section">
                    <div class="section-header">
                        <h2>2. 预览效果</h2>
                        <span class="hint" id="page-count">等待渲染...</span>
                    </div>
                    <div id="preview-area" class="preview-area">
                        <div class="empty-state">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <polyline points="21 15 16 10 5 21" />
                            </svg>
                            <p>点击"渲染预览"查看效果</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部操作按钮 -->
            <div class="actions">
                <button id="btn-render" class="btn btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10" />
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                    </svg>
                    渲染预览
                </button>
                <button id="btn-convert" class="btn btn-primary" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    转换所有页面
                </button>
                <button id="btn-zip" class="btn btn-primary" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    下载为ZIP
                </button>
                <div id="progress-container" class="progress-container" style="display: none;">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <span id="progress-text" class="progress-text">转换中... 0%</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部说明 -->
    <footer class="footer">
        <div class="container">
            <p>💡 使用提示：HTML代码中必须包含 <code>&lt;section class="page"&gt;</code> 元素，工具会自动识别并转换每个页面</p>
            <p>⚠️ 跨域资源（外部图片/字体）可能无法正确加载，建议使用内联样式或Data URI</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
